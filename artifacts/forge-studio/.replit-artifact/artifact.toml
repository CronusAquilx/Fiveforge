kind = "web"
previewPath = "/"
title = "Forge Studio"
description = "A local-first 3D editor for FiveM creators. Preview YFT vehicles and YTD textures, apply supported whole-mesh transforms and hide/delete edits, and rebuild matching YFTs into resource ZIP exports; standard 3D formats remain available for interchange."
version = "1.0.0"
id = "artifacts/forge-studio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21072

[services.development]
run = "pnpm --filter @workspace/forge-studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/forge-studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/forge-studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21072"
BASE_PATH = "/"
